<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f8f7f3">
    <meta name="color-scheme" content="light">
    <meta name="description" content="A personal mathematics competition library. BMO and BMT techniques, practice problems, hints, and worked solutions.">
    <title>Lemma — Mathematics library</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="page-shell" class="page-shell">
    <header class="site-header">
      <div class="header-inner">
      <div class="header-start">
        <button id="index-button" class="icon-button index-button" aria-label="Open navigation index" aria-haspopup="dialog" aria-controls="index-dialog" aria-expanded="false">
          <span class="index-glyph" aria-hidden="true">
            <svg class="index-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <svg class="index-chevron" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
          </span>
        </button>
        <a class="wordmark" href="#/" aria-label="Lemma home">lemma<span>.</span></a>
      </div>
      <nav class="header-links" aria-label="Library views">
        <a href="#/" data-header-link="library">Library</a>
        <a href="#/saved" data-header-link="saved">Saved<span id="saved-count"></span></a>
        <a href="#/materials" data-header-link="materials">Materials</a>
      </nav>
      <button id="add-button" class="button button-dark button-small" aria-label="Add material"><span aria-hidden="true">＋</span><span class="add-label">Add material</span></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><a href="#/" class="footer-brand">lemma.</a><span>A personal mathematics library</span><button id="backup-button" class="text-button">Export materials</button><label class="text-button import-label">Import<input type="file" id="import-input" accept="application/json,.json" hidden></label></footer>
    </div>
    <dialog id="index-dialog" class="drawer" aria-labelledby="index-title">
      <div class="drawer-header"><h2 id="index-title">Index</h2><button class="icon-button" data-close="index-dialog" aria-label="Close navigation">×</button></div>
      <a class="drawer-home" href="#/">All collections <span aria-hidden="true">↗</span></a>
      <nav id="index-tree" class="index-tree" aria-label="Competition, subject, and topic index"></nav>
      <div class="drawer-utility"><a href="#/saved">Saved ideas ↗</a><a href="#/materials">My materials ↗</a></div>
      <div class="drawer-footer">Competition <span>→</span> Subject <span>→</span> Topic</div>
    </dialog>
    <dialog id="material-dialog" class="modal" aria-labelledby="material-title">
      <div class="modal-top"><span class="eyebrow">YOUR COLLECTION</span><button class="icon-button" data-close="material-dialog" aria-label="Close material form">×</button></div>
      <h2 id="material-title">Add a material</h2>
      <p class="form-description" lang="zh-CN">收藏链接、笔记或文件，归档到对应知识点。资料仅保存在当前浏览器，可导出备份。</p>
      <form id="material-form">
        <label>Title<input name="title" required maxlength="120" placeholder="A note, a paper, an idea…" autocomplete="off"></label>
        <label>Collection<select name="collection" id="material-collection"></select></label>
        <label>Topic<select name="topic" id="material-topic"></select></label>
        <label>Link <span class="optional">optional</span><input name="url" type="url" placeholder="https://" autocomplete="off"></label>
        <label>Note <span class="optional">optional</span><textarea name="note" rows="3" maxlength="10000" placeholder="What would you like to remember?"></textarea></label>
        <label class="file-label">File <span class="optional">optional · up to 20 MB</span><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.docx,.pptx,.xlsx,.csv,.tex"></label>
        <p id="material-error" class="form-error" role="alert"></p>
        <button type="submit" class="button button-dark">Save material <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">Enable JavaScript to browse the mathematics library.</p></noscript>
  </body>
</html>
